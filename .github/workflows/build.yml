name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin if CI suddenly breaks on latest stable; remove comment to lock:
          # flutter-version: "3.27.4"
          cache: true

      - name: Flutter android scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create . --project-name goaledge_ai --platforms=android --org com.goaledge
          cp /tmp/pubspec.yaml.bak pubspec.yaml

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "No keystore secret - debug signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties
          echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          echo "Keystore OK"

      - name: Patch android gradle and manifest
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python3 tool/patch_android.py

      - name: Show android settings (debug)
        run: |
          echo "===== settings.gradle.kts ====="
          head -40 android/settings.gradle.kts 2>/dev/null || head -40 android/settings.gradle
          echo "===== app build.gradle ====="
          head -80 android/app/build.gradle.kts 2>/dev/null || head -80 android/app/build.gradle

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalEdge-AI-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release (in-app update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GoalEdge AI build ${{ github.run_number }}
          body: |
            Automatikus build #${{ github.run_number }}
            Telepíthető az appból (Frissítés dialógus).
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
