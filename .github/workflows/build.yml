name: Build GoalEdge AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter projekt inicializálása (android/ios scaffold)
        run: |
          # pubspec megőrzése – a flutter create felülírná
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create . --project-name goaledge_ai --platforms=android
          cp /tmp/pubspec.yaml.bak pubspec.yaml

      - name: Android engedélyek és Desugaring beállítása
        run: |
          python3 - << 'PY'
          import os, re

          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"

          if os.path.exists(kts_path):
              with open(kts_path, "r") as f:
                  s = f.read()
              if "isCoreLibraryDesugaringEnabled" not in s:
                  s = re.sub(r"(sourceCompatibility\s*=\s*JavaVersion\.VERSION_\d+)", r"isCoreLibraryDesugaringEnabled = true\n        \1", s, count=1)
              if "desugar_jdk_libs" not in s:
                  s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              with open(kts_path, "w") as f:
                  f.write(s)
          elif os.path.exists(groovy_path):
              with open(groovy_path, "r") as f:
                  s = f.read()
              if "coreLibraryDesugaringEnabled" not in s:
                  s = re.sub(r"(sourceCompatibility\s+JavaVersion\.VERSION_\d+)", r"coreLibraryDesugaringEnabled true\n        \1", s, count=1)
              if "desugar_jdk_libs" not in s:
                  s += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
              with open(groovy_path, "w") as f:
                  f.write(s)

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m = f.read()
              perms = ""
              if "android.permission.INTERNET" not in m:
                  perms += '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              if "android.permission.ACCESS_NETWORK_STATE" not in m:
                  perms += '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
              if "POST_NOTIFICATIONS" not in m:
                  perms += '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              if "VIBRATE" not in m:
                  perms += '    <uses-permission android:name="android.permission.VIBRATE"/>\n'
              if perms:
                  m = m.replace("<application", perms + "    <application", 1)
                  with open(manifest_path, "w") as f:
                      f.write(m)
          PY

      - name: Csomagok letöltése
        run: flutter pub get

      - name: APK fordítása
        run: flutter build apk --release

      - name: APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: GoalEdge-AI-v7.1
          path: build/app/outputs/flutter-apk/app-release.apk
